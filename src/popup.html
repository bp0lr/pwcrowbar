<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pwcrowbar</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        background: #f5f7fa;
        color: #1f2937;
        width: 280px;
      }

      h1 {
        font-size: 1.1rem;
        margin: 0 0 12px;
      }

      p {
        margin: 0 0 20px;
        font-size: 0.9rem;
        color: #4b5563;
      }

      button {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        background: #2563eb;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <h1>pwcrowbar</h1>
    <p>Open the full view to create or edit rules without closing the popup.</p>
    <button id="open-options">Open full view</button>

    <script src="popup.js"></script>
  </body>
</html>
